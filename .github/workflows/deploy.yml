name: CI - Test and Build Docker Image

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run unit tests
        env:
          # Dummy key so settings.yaml can load; real secrets are not needed for unit tests.
          OPENAI_API_KEY: "sk-test-placeholder"
        run: |
          uv run python -m pytest tests/unit/ --ignore=tests/unit/test_embedding_providers_smoke.py --ignore=tests/unit/test_image_storage.py --ignore=tests/unit/test_list_collections.py --ignore=tests/unit/test_loader_pdf_contract.py --ignore=tests/unit/test_pipeline_progress.py --ignore=tests/unit/test_protocol_handler.py --ignore=tests/unit/test_sparse_encoder.py --ignore=tests/unit/test_trace_service.py

      - name: Build Docker image (placeholder)
        run: |
          docker build -t modular-rag-dashboard:ci .

